<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinguaNote</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
  :root{
    --pink:#F9DFE3; --pink-soft:#FDEEF0; --pink-line:#F0CDD3;
    --purple:#6B4FA0; --purple-soft:#EFE9F7;
    --ink:#2B2B2B; --muted:#9A9A9A; --bg:#FAFAFA; --card:#FFFFFF;
    --rose:#B4576A; --rose-dark:#8A3D47;
    --warn-bg:#FBE7D4; --warn-text:#95591A;
    --shadow:0 4px 16px rgba(0,0,0,0.04);
    --border:#F1E4E6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; color:var(--ink);}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit;}

  /* ===== Layout ===== */
  #root{min-height:100vh;}
  .layout{display:flex; min-height:100vh;}
  .sidebar{width:230px; background:var(--pink-soft); border-right:1px solid var(--pink-line); display:flex; flex-direction:column; padding:22px 16px; flex-shrink:0;}
  .brand{display:flex; align-items:center; gap:10px; padding:0 4px 26px;}
  .logo-mark{width:38px; height:38px; border-radius:12px; background:#fff; border:1.5px solid var(--purple); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .logo-mark svg{width:20px; height:20px;}
  .logo-word{font-weight:800; font-size:15px; color:var(--purple); line-height:1.2;}
  .nav-link{display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:12px; color:#6a5459; font-size:14px; font-weight:500; cursor:pointer; margin-bottom:4px;}
  .nav-link.active{background:#fff; color:var(--purple); font-weight:700; box-shadow:var(--shadow);}
  .nav-link svg{width:18px; height:18px; flex-shrink:0;}
  .sidebar-footer{margin-top:auto; padding-top:16px; border-top:1px solid var(--pink-line);}
  .teacher-name{font-size:12.5px; color:#8a7176; margin-bottom:10px; padding:0 4px;}
  .logout-btn{width:100%; background:#fff; border:1px solid var(--pink-line); color:var(--rose-dark); border-radius:11px; padding:9px; font-size:13px; font-weight:600; cursor:pointer;}

  .content{flex:1; padding:30px 36px; max-width:1100px; overflow-x:hidden;}
  .page-title{font-size:23px; font-weight:800; margin:0 0 4px;}
  .page-sub{color:var(--muted); font-size:13.5px; margin:0 0 26px;}

  @media (max-width:820px){
    .layout{flex-direction:column;}
    .sidebar{width:100%; flex-direction:row; align-items:center; padding:14px 16px; gap:14px; overflow-x:auto;}
    .brand{padding:0; margin-right:8px;}
    .sidebar-footer{margin-top:0; padding-top:0; border-top:none; margin-left:auto; display:flex; align-items:center; gap:10px;}
    .teacher-name{display:none;}
    .content{padding:20px 16px;}
  }

  /* ===== Cards / grids ===== */
  .card{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:20px; box-shadow:var(--shadow);}
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:26px;}
  .stat-card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px; box-shadow:var(--shadow);}
  .stat-card .num{font-size:26px; font-weight:800; color:var(--purple);}
  .stat-card .lab{font-size:12.5px; color:var(--muted); margin-top:4px;}

  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:26px;}
  @media (max-width:820px){ .two-col{grid-template-columns:1fr;} }
  .card h3{margin:0 0 14px; font-size:15px; font-weight:700;}

  .mini-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:13.5px;}
  .mini-row:last-child{border-bottom:none;}
  .mini-row .who{font-weight:600;}
  .mini-row .when{color:var(--muted); font-size:12.5px;}
  .badge{font-size:11px; padding:3px 9px; border-radius:10px; font-weight:600;}
  .badge.warn{background:var(--warn-bg); color:var(--warn-text);}
  .badge.ok{background:var(--purple-soft); color:var(--purple);}
  .empty-note{color:var(--muted); font-size:13px; padding:8px 0;}

  /* ===== Students grid ===== */
  .students-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px;}
  .student-tile{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:18px; box-shadow:var(--shadow); cursor:pointer; transition:transform .1s;}
  .student-tile:hover{transform:translateY(-2px);}
  .student-tile .name{font-weight:700; font-size:16px; margin-bottom:8px;}
  .student-tile .row{display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); margin-top:4px;}
  .student-tile .row b{color:var(--ink); font-weight:600;}

  .fab{position:fixed; right:36px; bottom:30px; width:54px; height:54px; border-radius:50%; background:var(--purple); color:#fff; border:none; font-size:26px; box-shadow:0 8px 20px rgba(107,79,160,0.35); display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:20;}

  /* ===== Student detail ===== */
  .back-link{display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:13.5px; cursor:pointer; margin-bottom:14px;}
  .detail-header{display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start; justify-content:space-between; margin-bottom:24px;}
  .detail-name{font-size:24px; font-weight:800;}
  .detail-meta{color:var(--muted); font-size:13px; margin-top:4px;}
  .schedule-box{display:flex; align-items:center; gap:8px;}
  .schedule-box input{border:1px solid var(--border); border-radius:10px; padding:8px 10px; font-size:13px; font-family:inherit;}
  .schedule-box button{background:var(--purple); color:#fff; border:none; border-radius:10px; padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer;}

  .card-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  @media (max-width:900px){ .card-grid{grid-template-columns:1fr;} }

  .pill{background:var(--pink-soft); border:1px solid var(--pink-line); border-radius:14px; padding:13px 16px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; margin-bottom:10px;}
  .pill .label{font-weight:600; font-size:14px;}
  .pill .right{display:flex; align-items:center; gap:10px;}
  .pill .count{background:#fff; border-radius:10px; padding:2px 9px; font-size:12px; font-weight:700; color:var(--rose-dark);}
  .pill .plus{width:24px; height:24px; border-radius:50%; background:var(--purple); color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px;}

  .note-row{background:#fff; border:1px solid var(--border); border-radius:12px; padding:9px 12px; margin-bottom:7px;}
  .note-row .tag{font-size:10.5px; font-weight:700; color:var(--purple); text-transform:uppercase; letter-spacing:0.03em;}
  .note-row .text{font-size:13px; margin-top:2px;}
  .note-row .time{font-size:10.5px; color:var(--muted); margin-top:2px;}

  .check-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border);}
  .check-row:last-child{border-bottom:none;}
  .check-row .check{width:20px; height:20px; border-radius:6px; border:1.5px solid var(--pink-line); flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:12px; color:#fff;}
  .check-row .check.done{background:var(--purple); border-color:var(--purple);}
  .check-row .txt{font-size:13.5px; flex:1;}
  .check-row .txt.done{color:var(--muted); text-decoration:line-through;}

  .add-row{display:flex; gap:8px; margin-top:12px;}
  .add-row input{flex:1; border:1px solid var(--border); border-radius:12px; padding:9px 12px; font-size:13px; font-family:inherit;}
  .add-row button{background:var(--purple); color:#fff; border:none; border-radius:12px; padding:0 16px; font-size:13px; font-weight:600; cursor:pointer;}

  .big-cta{display:block; width:100%; background:var(--purple); color:#fff; border:none; border-radius:14px; padding:14px; font-size:14.5px; font-weight:700; cursor:pointer; margin-bottom:10px;}
  .ghost-btn{display:block; width:100%; background:none; color:var(--rose-dark); border:1.5px solid var(--pink-line); border-radius:14px; padding:11px; font-size:13.5px; font-weight:600; cursor:pointer;}

  .pay-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .pay-num{font-size:28px; font-weight:800; color:var(--purple);}
  .pay-lab{font-size:12px; color:var(--muted);}
  .add-payment-btn{background:var(--purple-soft); color:var(--purple); border:none; border-radius:12px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer;}

  .chart{display:flex; align-items:flex-end; gap:10px; height:140px; padding-top:10px;}
  .chart-col{display:flex; flex-direction:column; align-items:center; gap:4px; flex:1;}
  .chart-bars{display:flex; align-items:flex-end; gap:2px; height:100px;}
  .chart-bar{width:7px; border-radius:3px 3px 0 0;}
  .chart-lbl{font-size:10px; color:var(--muted);}
  .chart-legend{display:flex; gap:14px; margin-top:10px; font-size:11px; color:var(--muted);}
  .chart-legend span{display:inline-flex; align-items:center; gap:5px;}
  .chart-legend i{width:8px; height:8px; border-radius:2px; display:inline-block;}

  .history-item{background:#fff; border:1px solid var(--border); border-radius:14px; padding:12px 14px; margin-bottom:10px;}
  .history-item .hrow{display:flex; justify-content:space-between; align-items:center;}
  .history-item .hlabel{font-weight:600; font-size:13.5px;}
  .history-item .hdate{font-size:11px; color:var(--muted);}
  .history-item .hcounts{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
  .hcounts span{font-size:10.5px; background:var(--pink-soft); color:var(--rose-dark); padding:3px 8px; border-radius:9px;}

  /* ===== Auth ===== */
  .auth-page{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .auth-card{width:100%; max-width:380px; background:#fff; border-radius:22px; padding:32px 28px; box-shadow:0 12px 40px rgba(0,0,0,0.08);}
  .auth-card .brand{padding:0 0 22px; justify-content:center;}
  .role-tabs{display:flex; background:var(--pink-soft); border-radius:14px; padding:4px; margin-bottom:18px;}
  .role-tabs button{flex:1; border:none; background:none; padding:10px; border-radius:11px; font-size:13.5px; font-weight:600; color:var(--muted); cursor:pointer; font-family:inherit;}
  .role-tabs button.active{background:#fff; color:var(--purple); box-shadow:var(--shadow);}
  .mode-toggle{display:flex; justify-content:center; gap:18px; margin-bottom:18px;}
  .mode-toggle span{font-size:13px; color:var(--muted); cursor:pointer; padding-bottom:4px;}
  .mode-toggle span.active{color:var(--ink); font-weight:700; border-bottom:2px solid var(--purple);}
  input.field{width:100%; border:1px solid var(--border); border-radius:14px; padding:12px 14px; font-size:14.5px; font-family:inherit; margin-bottom:11px;}
  input.field:focus{outline:2px solid var(--purple); outline-offset:1px;}
  .primary-btn{display:block; width:100%; background:var(--rose-dark); color:#fff; border:none; border-radius:14px; padding:13px; font-size:14.5px; font-weight:700; cursor:pointer; margin-top:4px;}
  .primary-btn:disabled{opacity:0.6;}
  .error-box{background:#FCE8E8; color:#A23B3B; border-radius:11px; padding:9px 13px; font-size:12.5px; margin-bottom:11px;}
  .hint{font-size:11.5px; color:var(--muted); margin:-2px 0 13px; line-height:1.5;}

  /* ===== Modal ===== */
  .overlay{position:fixed; inset:0; background:rgba(30,20,22,0.35); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .overlay.show{display:flex;}
  .sheet{width:100%; max-width:400px; background:#fff; border-radius:20px; padding:22px; animation:pop .15s ease-out;}
  @keyframes pop{from{transform:scale(0.97); opacity:0;} to{transform:scale(1); opacity:1;}}
  .sheet .cat-chip{display:inline-block; background:var(--pink-soft); color:var(--rose-dark); font-size:12px; font-weight:700; padding:4px 12px; border-radius:12px; margin-bottom:14px;}
  .sheet textarea{width:100%; border:1px solid var(--border); border-radius:14px; padding:12px 14px; font-size:14px; font-family:inherit; resize:none; margin-bottom:12px;}
  .tag-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .tag-chip{background:#F7F2F2; color:#7A7A7A; font-size:12px; padding:6px 12px; border-radius:12px; cursor:pointer; border:1px solid transparent;}
  .tag-chip.selected{background:var(--purple-soft); color:var(--purple); border-color:var(--purple);}
  .save-btn{width:100%; background:var(--rose-dark); color:#fff; border:none; border-radius:16px; padding:13px; font-size:14.5px; font-weight:700; cursor:pointer;}
  .cancel-link{display:block; text-align:center; margin-top:11px; color:var(--muted); font-size:12.5px; background:none; border:none; width:100%; cursor:pointer;}
  .invite-code-box{background:var(--purple-soft); border-radius:16px; padding:18px; text-align:center; margin-bottom:14px;}
  .invite-code-box .code{font-size:24px; font-weight:800; letter-spacing:0.12em; color:var(--purple); margin-top:6px;}

  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:26px; background:#2B2B2B; color:#fff; padding:10px 18px; border-radius:14px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:60;}
  .toast.show{opacity:1;}
  .loading{margin:80px 0; text-align:center; color:var(--muted); font-size:13px;}
  .empty{color:var(--muted); font-size:14px; line-height:1.6; padding:20px 0;}
</style>
</head>
<body>
<div id="root"><div class="loading">Загрузка…</div></div>
<div class="toast" id="toast"></div>

<script>
if(!window.SUPABASE_URL || window.SUPABASE_URL.indexOf('ВСТАВЬ') === 0){
  document.getElementById('root').innerHTML = '<div class="empty" style="margin:80px 24px; text-align:center;">Сначала впиши данные своего проекта Supabase в файл <b>config.js</b> (SUPABASE_URL и SUPABASE_ANON_KEY), затем обнови страницу.</div>';
  throw new Error('Supabase config missing');
}

const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

const CATS = [
  {key:'grammar', label:'Grammar', color:'#B4576A', tags:['артикли','предлоги','времена','порядок слов']},
  {key:'pronunciation', label:'Pronunciation', color:'#6B4FA0', tags:['th звук','ударение','интонация','гласные']},
  {key:'vocabulary', label:'Vocabulary', color:'#D9A441', tags:['синонимы','ложные друзья','фразовые глаголы','идиомы']}
];

let session = null, profile = null, authMode = 'login', authRole = 'teacher', currentPage = 'overview';
let suppressAuthListener = false;
const root = document.getElementById('root');
const toastEl = document.getElementById('toast');

function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); setTimeout(()=> toastEl.classList.remove('show'), 2000); }
function esc(str){ const d=document.createElement('div'); d.textContent=str==null?'':String(str); return d.innerHTML; }
function genCode(){ const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let o=''; for(let i=0;i<6;i++) o+=c[Math.floor(Math.random()*c.length)]; return o; }
function fmtDate(d){ return new Date(d).toLocaleDateString('ru-RU', {day:'numeric', month:'short'}); }
function fmtDateTime(d){ return new Date(d).toLocaleString('ru-RU', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}); }
function logoSVG(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="#6B4FA0" stroke-width="1.8"><path d="M4 12a8 8 0 1 1 3.2 6.4L4 20l1.1-3.4A7.96 7.96 0 0 1 4 12Z" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }

async function boot(){
  const { data:{ session: s } } = await sb.auth.getSession();
  session = s;
  await afterAuthChange();
  sb.auth.onAuthStateChange(async (_e, s2)=>{
    if(suppressAuthListener) return;
    session = s2; currentPage='overview'; await afterAuthChange();
  });
}

async function afterAuthChange(){
  if(!session){ profile = null; renderAuth(); return; }
  root.innerHTML = '<div class="loading">Загрузка…</div>';
  const { data, error } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  if(error){ toast('Ошибка загрузки профиля'); return; }
  profile = data;
  if(!profile){ toast('Профиль не найден, попробуй войти снова'); await sb.auth.signOut(); return; }
  if(profile.role === 'teacher') renderTeacherApp(); else renderStudentApp();
}

// ================= AUTH =================
function renderAuth(){
  root.innerHTML = `
    <div class="auth-page">
      <div class="auth-card">
        <div class="brand"><div class="logo-mark">${logoSVG()}</div><div class="logo-word">LinguaNote</div></div>
        <div class="role-tabs">
          <button id="tabTeacher" class="${authRole==='teacher'?'active':''}">Я преподаватель</button>
          <button id="tabStudent" class="${authRole==='student'?'active':''}">Я студент</button>
        </div>
        <div class="mode-toggle">
          <span id="modeLogin" class="${authMode==='login'?'active':''}">Войти</span>
          <span id="modeSignup" class="${authMode==='signup'?'active':''}">Зарегистрироваться</span>
        </div>
        <div id="errBox"></div>
        <div id="authForm"></div>
      </div>
    </div>
  `;
  document.getElementById('tabTeacher').onclick = ()=>{ authRole='teacher'; renderAuth(); };
  document.getElementById('tabStudent').onclick = ()=>{ authRole='student'; renderAuth(); };
  document.getElementById('modeLogin').onclick = ()=>{ authMode='login'; renderAuth(); };
  document.getElementById('modeSignup').onclick = ()=>{ authMode='signup'; renderAuth(); };
  renderAuthForm();
}
function showAuthError(msg){ document.getElementById('errBox').innerHTML = msg ? `<div class="error-box">${esc(msg)}</div>` : ''; }
function renderAuthForm(){
  const form = document.getElementById('authForm');
  if(authMode==='login'){
    form.innerHTML = `<input class="field" type="email" id="email" placeholder="Email"><input class="field" type="password" id="password" placeholder="Пароль"><button class="primary-btn" id="submitBtn">Войти</button>`;
    document.getElementById('submitBtn').onclick = doLogin;
  } else {
    form.innerHTML = `
      <input class="field" type="text" id="name" placeholder="Имя">
      <input class="field" type="email" id="email" placeholder="Email">
      <input class="field" type="password" id="password" placeholder="Пароль (мин. 6 символов)">
      ${authRole==='student' ? '<input class="field" type="text" id="inviteCode" placeholder="Код приглашения от преподавателя">' : ''}
      <button class="primary-btn" id="submitBtn">Зарегистрироваться</button>
      <p class="hint">${authRole==='student' ? 'Код приглашения даёт преподаватель для каждого студента отдельно.' : 'После регистрации ты сможешь добавить студентов и выдавать им коды приглашения.'}</p>
    `;
    document.getElementById('submitBtn').onclick = doSignup;
  }
}
async function doLogin(){
  showAuthError(null);
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='Входим…';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled=false; btn.textContent='Войти';
  if(error) showAuthError(error.message);
}
async function doSignup(){
  showAuthError(null);
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const inviteCode = authRole==='student' ? document.getElementById('inviteCode').value.trim().toUpperCase() : null;
  if(!name || !email || !password){ showAuthError('Заполни все поля'); return; }
  if(authRole==='student' && !inviteCode){ showAuthError('Введи код приглашения'); return; }
  const btn = document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='Регистрируем…';

  suppressAuthListener = true;
  try{
    const { data, error } = await sb.auth.signUp({ email, password });
    if(error){ showAuthError(error.message); return; }
    if(!data.session){
      showAuthError('Проверь почту для подтверждения аккаунта, затем войди.');
      authMode='login'; renderAuth(); return;
    }
    session = data.session;

    const { error: profErr } = await sb.from('profiles').insert({ id: data.user.id, role: authRole, name });
    if(profErr){ showAuthError('Ошибка при создании профиля: ' + profErr.message); return; }

    if(authRole==='student'){
      const { error: joinErr } = await sb.rpc('join_with_code', { code: inviteCode });
      if(joinErr){ showAuthError('Аккаунт создан, но код приглашения неверный: ' + joinErr.message); return; }
    }

    toast('Добро пожаловать!');
    await afterAuthChange();
  } finally {
    btn.disabled=false; btn.textContent='Зарегистрироваться';
    suppressAuthListener = false;
  }
}

// ================= TEACHER SHELL =================
function teacherShell(activePage, innerHTML){
  root.innerHTML = `
    <div class="layout">
      <div class="sidebar">
        <div class="brand"><div class="logo-mark">${logoSVG()}</div><div class="logo-word">LinguaNote</div></div>
        <div class="nav-link ${activePage==='overview'?'active':''}" id="navOverview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
          Обзор
        </div>

    <div class="sheet">

  document.getElementById('root').appendChild(overlay);
  let selectedTag = null;
  overlay.querySelectorAll('.tag-chip').forEach(chip=>{
    chip.onclick = ()=>{ overlay.querySelectorAll('.tag-chip').forEach(c=>c.classList.remove('selected')); if(selectedTag===chip.dataset.tag){selectedTag=null;} else {selectedTag=chip.dataset.tag; chip.classList.add('selected');} };
  });

  document.getElementById('cancelNoteBtn').onclick = ()=> overlay.remove();

    const { error } = await sb.from('notes').insert({ lesson_id: lessonId, category: catKey, text: text || selectedTag, tag: selectedTag });

    if(error){ toast('Ошибка: ' + error.message); return; }

    renderStudentDetail(studentId);
  };
}

// ---------- Reusable checklist (plans & homework) ----------
async function renderChecklist(container, table, studentId, editable, checkable){
  if(checkable === undefined) checkable = editable;
  const { data } = await sb.from(table).select('*').eq('student_id', studentId).order('created_at', {ascending:true});
  const items = data || [];
  const listWrap = document.createElement('div');
  container.appendChild(listWrap);
  function draw(){
    listWrap.innerHTML = '';
    if(items.length===0){ listWrap.innerHTML = `<div class="empty-note">${editable ? 'Пока пусто — добавь ниже.' : 'Пока ничего не добавлено.'}</div>`; return; }
    items.forEach(it=>{
      const row = document.createElement('div'); row.className='check-row';
      row.innerHTML = `<span class="check ${it.done?'done':''}" style="${checkable?'':'cursor:default;'}">${it.done?'✓':''}</span><span class="txt ${it.done?'done':''}">${esc(it.text)}</span>`;
      if(checkable){
        row.querySelector('.check').onclick = async ()=>{
          const { error } = await sb.from(table).update({ done: !it.done }).eq('id', it.id);
          if(error){ toast('Ошибка: ' + error.message); return; }
          it.done = !it.done; draw();
        };
      }
      listWrap.appendChild(row);
    });
  }
  draw();
  if(editable){
    const addRow = document.createElement('div'); addRow.className='add-row';
    addRow.innerHTML = `<input placeholder="${table==='homework' ? 'например: выучить 10 слов' : 'например: Present Perfect'}"><button>+</button>`;
    container.appendChild(addRow);
    const input = addRow.querySelector('input');
    const btn = addRow.querySelector('button');
    const add = async ()=>{
      const text = input.value.trim(); if(!text) return;
      const { data:d, error } = await sb.from(table).insert({ student_id: studentId, text }).select().single();
      if(error){ toast('Ошибка: ' + error.message); return; }
      items.push(d); input.value=''; draw();
    };
    btn.onclick = add;
    input.onkeydown = (e)=>{ if(e.key==='Enter') add(); };
  }
}

// ---------- Progress chart ----------
async function renderChart(container, studentId){
  const { data: lessons } = await sb.from('lessons').select('*').eq('student_id', studentId).eq('status','completed').order('lesson_number', {ascending:true});
  const lessonsArr = (lessons || []).slice(-8);
  if(lessonsArr.length===0){ container.innerHTML = `<div class="empty-note">Данные появятся после первого завершённого урока.</div>`; return; }
  const ids = lessonsArr.map(l=>l.id);
  const { data: allNotes } = await sb.from('notes').select('*').in('lesson_id', ids);
  const byLesson = {};
  (allNotes||[]).forEach(n=>{ byLesson[n.lesson_id] = byLesson[n.lesson_id] || {grammar:0,pronunciation:0,vocabulary:0}; byLesson[n.lesson_id][n.category]++; });
  let max = 1;
  lessonsArr.forEach(l=>{ const c = byLesson[l.id] || {grammar:0,pronunciation:0,vocabulary:0}; max = Math.max(max, c.grammar, c.pronunciation, c.vocabulary); });

  const cols = lessonsArr.map(l=>{
    const c = byLesson[l.id] || {grammar:0,pronunciation:0,vocabulary:0};
    const bars = CATS.map(cat=>{
      const h = Math.round((c[cat.key]/max)*100);
      return `<div class="chart-bar" style="height:${Math.max(h,3)}px; background:${cat.color};" title="${cat.label}: ${c[cat.key]}"></div>`;
    }).join('');
    return `<div class="chart-col"><div class="chart-bars">${bars}</div><div class="chart-lbl">L${l.lesson_number}</div></div>`;
  }).join('');

  container.innerHTML = `
    <div class="chart">${cols}</div>
    <div class="chart-legend">${CATS.map(c=>`<span><i style="background:${c.color};"></i>${c.label}</span>`).join('')}</div>
  `;
}
